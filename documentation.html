<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png" />
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StegoLines — Documentation Index</title>
  <meta name="description" content="STEGNOLINES project documentation — guides, reference, and architecture."/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Alexandria:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <script src="js/i18n/common.js"></script>
  <script src="js/i18n/docs.js"></script>
  <script src="js/i18n/toasts.js"></script>
  <script src="js/i18n/index.js"></script>
  <script>
    window.translations = mergeI18n(I18N_COMMON, I18N_DOCS, I18N_TOASTS);
  </script>
  <script src="js/shared/theme-manager.js"></script>
  <script>window.DOCS_BASE = '';</script>
</head>
<body class="docs-body docs-index-page">
  <script src="js/features/page-loader.js"></script>

  <!-- Top Navigation Placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- ═══ Main Content ═══ -->
  <main class="main-content docs-index-main">
    <header class="main-header">
      <h1 class="text-display-lg" data-i18n="docsTitle">Documentation Index</h1>
      <p class="text-body-lg" data-i18n="docsSubtitle">Guides, references, and technical docs for the STEGNOLINES steganography platform.</p>
    </header>

    <!-- Search Section -->
    <section class="card docs-index-search-card" aria-label="Search documentation">
      <form class="docs-index-search" role="search" onsubmit="event.preventDefault(); return false;">
        <span class="material-symbols-outlined docs-index-search__icon" aria-hidden="true">search</span>
        <input
          type="search"
          class="form-input docs-index-search__input"
          id="docs-search-input"
          placeholder="What can we help you find?"
          aria-label="Search documentation"
        />
        <button type="submit" class="btn btn--primary docs-index-search__submit" data-i18n="searchBtn">Search</button>
      </form>
    </section>

    <!-- Index Grid (Dynamically Populated) -->
    <div class="docs-index-grid" id="docs-index-grid">
      <!-- Generated via JS -->
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <script src="js/docs/nav-data.js"></script>
  <script src="js/docs/docs.js"></script>
  <script src="js/shared/ui-helpers.js"></script>
  <script src="js/shared/template-loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('stegoLang') || 'en';
      const guideBtn = document.querySelector('.floating-guide-btn');
      if (guideBtn) {
        guideBtn.setAttribute('data-tooltip', savedLang === 'ar' ? 'إرشادات الموقع' : 'Site Guide');
      }
    });
  </script>

  <!-- Floating Help/Guide Button -->
  <button type="button" class="floating-guide-btn" data-tooltip="Site Guide">
    <span class="material-symbols-outlined">help</span>
  </button>
</body>
</html>
