<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Stegnolines — Extraction Engine Test Runner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 24px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { color: #38bdf8; }
    #test-summary {
      font-weight: bold;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .summary-pass { background: #064e3b; color: #34d399; }
    .summary-fail { background: #7f1d1d; color: #f87171; }
    .test-row {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .test-row.pass { border-inline-start: 4px solid #10b981; }
    .test-row.fail { border-inline-start: 4px solid #ef4444; }
    pre { background: #020617; padding: 8px; border-radius: 4px; color: #f43f5e; overflow-x: auto; }
  </style>

  <!-- Engine Scripts -->
  <script src="../../../js/features/stego-analysis/extract/carriers.js"></script>
  <script src="../../../js/features/stego-analysis/extract/profile.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/stegnolines.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/binary.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/baseN.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/unicodeTags.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/variationSel.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/zwc.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/positional.js"></script>
  <script src="../../../js/features/stego-analysis/extract/schemes/index.js"></script>
  <script src="../../../js/features/stego-analysis/extract/decapsulate.js"></script>
  <script src="../../../js/features/stego-analysis/extract/sanitize.js"></script>
  <script src="../../../js/features/stego-analysis/extract/analyze.js"></script>
</head>
<body>
  <h1>Stegnolines Extraction Engine Test Suite</h1>
  <div id="test-summary">Running tests...</div>
  <div id="test-results"></div>

  <script src="./stego-extract.test.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof runAllTests === 'function') {
        runAllTests();
      }
    });
  </script>
</body>
</html>
