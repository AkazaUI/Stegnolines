<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../assets/brand/favicon.png" />
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StegoLines — Chat Import & Text Extractor</title>
  <meta name="description" content="Import exported social-media chats and extract clean text messages locally in your browser."/>
  
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
  <!-- Stegnolines Shared CSS Hub (tokens, reset, layout, all components) -->
  <link rel="stylesheet" href="../css/main.css"/>
  <!-- Chat Scanner Supplemental Styles -->
  <link rel="stylesheet" href="css/chat-scanner.css"/>
  <!-- Flatpickr Date Picker (lightweight, locale-independent) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>
  
  <!-- Stegnolines Shared i18n & Core Scripts (Head) -->
  <script src="../js/i18n/common.js"></script>
  <script src="../js/i18n/extract.js"></script>
  <script src="../js/i18n/toasts.js"></script>
  <script src="../js/i18n/index.js"></script>
  <script>
    window.translations = mergeI18n(I18N_COMMON, I18N_EXTRACT, I18N_TOASTS);
  </script>
  <script src="../js/shared/theme-manager.js"></script>
  <script src="../js/shared/connection-monitor.js"></script>
</head>
<body>
  <script src="../js/features/page-loader.js"></script>

  <!-- Stegnolines Top Navigation (Loaded Automatically by template-loader.js) -->
  <div id="navbar-placeholder"></div>

  <!-- ═══ Main Content ═══ -->
  <main class="main-content">
    <header class="main-header">
      <h1 class="text-display-lg" data-i18n="chatScannerTitle">Chat Import & Text Extractor</h1>
      <p class="text-body-lg" data-i18n="chatScannerSubtitle">Import exported social-media chats and extract clean text messages — 100% local processing.</p>
    </header>

    <!-- Chat Scanner Interface Panel -->
    <section id="panel-chat-scanner" class="card"></section>
  </main>

  <!-- Stegnolines Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- ═══ Core Libraries ═══ -->
  <script src="../js/shared/ui-helpers.js"></script>

  <!-- Chat Scanner Non-Module Scripts -->
  <script src="js/chat-parsers.js?v=2"></script>
  <script src="js/chat-export.js?v=2"></script>
  <script src="js/chat-scanner.js?v=2"></script>
  <script src="js/app.js?v=2"></script>

  <!-- ═══ Dynamic Templates Loader (MUST be last — injects navbar/footer/settings) ═══ -->
  <script src="../js/shared/template-loader.js"></script>

</body>
</html>
