name: Deploy StegoLines to Hostinger

on:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: '🧹 مسح كامل وإعادة رفع نظيفة (Clean Slate - يحذف الملفات القديمة بالكامل)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ الكود (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 تثبيت الحزم (Install Dependencies)
        run: npm ci

      - name: 🏗️ بناء الموقع (Build Site)
        run: npm run build

      - name: 🧹 تنظيف الملفات غير المرغوبة من الاستضافة (اختياري / مخصص)
        # يقوم هذا الإجراء بالتأكد من عدم وجود أي مجلدات تطويرية داخل _site قبل الرفع
        run: |
          echo "Verifying _site directory contents before FTP upload..."
          ls -la ./_site/

      - name: 🚀 رفع الملفات المبنية إلى هوستنجر عبر FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_site/
          server-dir: ./
          dangerous-clean-slate: ${{ github.event.inputs.clean_slate || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agent/**
            **/build-tools/**
            **/node_modules/**
            **/package*.json
            **/README.md
            **/.well-known/**
